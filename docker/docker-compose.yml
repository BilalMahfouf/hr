services:
  hr-db:
    image: postgres:17
    environment:
      POSTGRES_DB: veterinary_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-2501}
    volumes:
      - hr-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5433:5432"
    networks:
      - hr-network

  hr-pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-billelmh501@gmail.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-billel501}
    ports:
      - "5051:80"
    depends_on:
      hr-db:
        condition: service_healthy
    networks:
      - hr-network

  hr-api:
    build:
      context: ../backend
      dockerfile: src/Api/PublicApi/Dockerfile
    env_file:
      - ../backend/src/Api/PublicApi/.env
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: "http://+:8080"
      DefaultConnectionLocal: "Host=hr-db;Port=5432;Database=veterinary_db;Username=postgres;Password=${DB_PASSWORD:-2501};Pooling=true;"
    ports:
      - "8081:8080"
    depends_on:
      hr-db:
        condition: service_healthy
    networks:
      - hr-network

  hr-frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://hr-api:8080/api/v1
    ports:
      - "3001:3000"
    depends_on:
      - hr-api
    networks:
      - hr-network

volumes:
  hr-db-data:

networks:
  hr-network:
    driver: bridge